name: Build KeyTone Studio

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/companion-electron/**"
      - ".github/workflows/companion-build.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: apps/companion-electron
        run: npm install

      - name: Build installers
        working-directory: apps/companion-electron
        run: npm run dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keytone-studio-${{ matrix.os }}
          path: |
            apps/companion-electron/dist/*.exe
            apps/companion-electron/dist/*.dmg
